<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <h1> Gerenciador de Tarefas </h1>
    <p> Organize suas tarefas de forma eficiente. </p>

    <h2> Nova tarefa </h2>
    <form id="formtarefa">

        <label for="descricao"> Descrição: </label>
        <input type="text" id="descricao">

        <label for="categoria"> Categoria: </label>
        <select id="categoria">
            <option value="">Selecione</option>
            <option value="trabalho"> Trabalho </option>
            <option value="estudos"> Estudos </option>
            <option value="pessoal"> Pessoal </option>  
        </select>

        <label for="prioridade"> Prioridade: </label>
        <select id="prioridade">
            <option value="">Selecione</option>
            <option value="alta"> Urgente </option>
            <option value="media"> Média </option>
            <option value="baixa"> Baixa </option>
        </select>

        <label for="data"> Data: </label>
        <input type="date" id="data">

        <button id= "btnadicionar"type="button">Adicionar tarefa</button>

        <section>
            <h2> Filtros </h2>
            <label for="filtro_situacao"> Situação: </label>
            <select id="filtro_situacao">
                <option value="">Todos</option>
                <option value="pendente"> Pendente </option>
                <option value="concluida"> Concluída </option>
            </select>

            <label for="filtro_categoria"> Categoria: </label>
            <select id="filtro_categoria">
                <option value="">Todos</option>
                <option value="trabalho"> Trabalho </option>
                <option value="estudos"> Estudos </option>
                <option value="pessoal"> Pessoal </option>
            </select>
        </section>

        <section>
            <h2> Lista de tarefas </h2>
            <div id="lista_tarefas">
            </div>

    </form>

</body>
</html>
