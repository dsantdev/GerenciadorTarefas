<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main>
        <h1>Gerenciador de Tarefas</h1>
        <p>Organize suas tarefas de forma eficiente.</p>

        <section>
            <h2>Nova tarefa</h2>
            <form id="formtarefa">
                <label for="descricao">Descrição:</label>
                <input type="text" id="descricao">

                <label for="categoria">Categoria:</label>
                <select id="categoria">
                    <option value="">Selecione</option>
                    <option value="Trabalho">Trabalho</option>
                    <option value="Estudos">Estudos</option>
                    <option value="Pessoal">Pessoal</option>
                </select>

                <label for="prioridade">Prioridade:</label>
                <select id="prioridade">
                    <option value="">Selecione</option>
                    <option value="Alta">Alta</option>
                    <option value="Média">Média</option>
                    <option value="Baixa">Baixa</option>
                </select>

                <label for="data">Data de conclusão:</label>
                <input type="date" id="data">

                <button type="submit" id="btnadicionar">Adicionar tarefa</button>
                <p id="mensagem_erro"></p>
            </form>
        </section>

        <section>
            <h2>Filtros</h2>
            <label for="filtro_situacao">Situação:</label>
            <select id="filtro_situacao">
                <option value="">Todas</option>
                <option value="pendente">Pendentes</option>
                <option value="concluida">Concluídas</option>
            </select>

            <label for="filtro_categoria">Categoria:</label>
            <select id="filtro_categoria">
                <option value="">Todas</option>
                <option value="Trabalho">Trabalho</option>
                <option value="Estudos">Estudos</option>
                <option value="Pessoal">Pessoal</option>
            </select>
        </section>

        <section>
            <h2>Resumo</h2>
            <p>Total de tarefas: <span id="total">0</span></p>
            <p>Tarefas pendentes: <span id="pendentes">0</span></p>
            <p>Tarefas concluídas: <span id="concluidas">0</span></p>
        </section>

        <section>
            <h2>Lista de tarefas</h2>
            <div id="listatarefas"></div>
        </section>
    </main>
</body>
</html>
